<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1783 546" preserveAspectRatio="xMidYMid meet">
  <!-- الخلفية الداكنة -->
  <rect width="1783" height="546" fill="#1a1a1a"/>
  
  <!-- كلمة FG باللون البرتقالي -->
  <g font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="340" letter-spacing="-12">
    <text x="50" y="330" fill="#e85d1f">FG</text>
  </g>
  
  <!-- كلمة ELITE باللون الأبيض -->
  <g font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="340" letter-spacing="-8">
    <text x="580" y="330" fill="#ffffff">ELITE</text>
  </g>
  
  <!-- الخط البرتقالي الفاصل -->
  <rect x="50" y="380" width="1683" height="16" fill="#e85d1f"/>
  
  <!-- النص السفلي -->
  <text x="891" y="480" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="46" fill="#ffffff" text-anchor="middle" letter-spacing="4">PRODUCTION MULTIMEDIA LIGHTING SOUND SCREENS</text>
</svg>