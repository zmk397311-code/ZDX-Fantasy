<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" preserveAspectRatio="xMidYMid meet">
  <!-- لا توجد خلفية هنا، اللوقو شفاف تماماً ليندمج مع التطبيق -->
  
  <!-- كلمة FG باللون البرتقالي -->
  <g transform="scale(1.05, 1)">
    <text x="40" y="205" font-family="'Arial Black', 'Helvetica Neue', Impact, sans-serif" font-weight="900" font-size="220" fill="#ea5b17" letter-spacing="-8">FG</text>
  </g>
  
  <!-- كلمة ELITE باللون الأبيض -->
  <g transform="scale(1.05, 1)">
    <text x="400" y="205" font-family="'Arial Black', 'Helvetica Neue', Impact, sans-serif" font-weight="900" font-size="220" fill="#ffffff" letter-spacing="-10">ELITE</text>
  </g>
  
  <!-- الخط البرتقالي الفاصل -->
  <rect x="40" y="238" width="1120" height="12" fill="#ea5b17" rx="2"/>
  
  <!-- النص السفلي -->
  <text x="600" y="300" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle" letter-spacing="3">PRODUCTION  MULTIMEDIA  LIGHTING  SOUND  SCREENS</text>
</svg>
